name = "typix-worker"
main = "src/index.ts"
compatibility_date = "2025-05-15"

[[d1_databases]]
binding = "DB"
database_name = "typix-db"
database_id = "local-dev"

[[r2_buckets]]
binding = "R2"
bucket_name = "typix-images"

[vars]
JWT_SECRET = ""

[env.production]
vars = { ENVIRONMENT = "production" }
